<!doctype html>
<html lang="ja"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日記修復コピー検証</title><link rel="stylesheet" href="style.css">
<main><h1>日記修復コピー検証</h1>
<p>ローカルコピー専用。Google・端末の保存領域への書込みや同期は行いません。生成ファイルには全原本が含まれます。非公開で保管してください。</p>
<p>実データを公開サイトへ入力せず、この専用ツールを隔離したローカル環境で開いてください。</p>
<label>本人確認済み private manifest JSON <input id="manifest" type="file" accept=".json"></label>
<label>今回読み取った各保存元のスナップショット JSON <input id="current" type="file" accept=".json"></label>
<button id="dry">dry-run</button><button id="cancel">中止・入力破棄</button>
<pre id="summary" role="status"></pre>
<button id="backup" disabled>原本アーカイブを保存</button>
<label>保存した原本アーカイブを再選択 <input id="readback" type="file" accept=".json"></label>
<label>表示された計画IDを入力 <input id="confirmation" autocomplete="off"></label>
<label><input id="review" type="checkbox"> 対象2件・全variant・対応ID・変更後の履歴を原本アーカイブで確認しました</label>
<button id="execute" disabled>検証済み修復コピーを生成・保存</button>
<p>このファイルを現行アプリの追加復元へ入れても、同ID衝突は直りません。実運用への切替機能は未実装です。</p>
</main><script src="../../diary-core.js"></script><script src="../../diary-repair.js"></script><script src="ui.js"></script></html>
