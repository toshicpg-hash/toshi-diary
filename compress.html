<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>PAPA HUB 保存済みバックアップの圧縮</title><link rel="stylesheet" href="backup.css"><link rel="stylesheet" href="compress.css"><script src="compress.js" defer></script></head>
<body><main><h1>保存したバックアップを小さくする</h1><p>ダウンロード済みのFlip・Foldのバックアップを選んでください。2つまとめて選べます。</p><p>この端末内で、内容を変えずに圧縮したコピーを作ります。元ファイルとDriveの原本は残ります。</p><label for="files">バックアップファイルを選ぶ</label><input id="files" type="file" accept="application/json,.json" multiple><p id="progress" role="status" aria-live="polite">ファイル選択後、圧縮を始めます。この画面を開いたままにしてください。</p><div id="results" class="actions"></div><p class="note">「圧縮したコピーを保存」を押して保存後、そのファイルをDriveの「00_一時保存」へ入れてください。同期・復元・端末データの読み書き・Googleへの自動送信は行いません。</p></main></body></html>
